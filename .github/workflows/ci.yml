name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 26.4.0 is @opentui/core's Node floor; the non-Bun toolchain runs on it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.4.0
          cache: npm

      # tsc, oxlint and scripts/build.mjs run on node; the test script is `bun test`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - run: npm ci --ignore-scripts

      # The published package ships only jsonc-parser and string-width; gate on
      # the production tree alone, where registry advisories are actionable.
      - run: npm audit --omit=dev --audit-level=low

      - run: npm run check:compatibility

      - name: Verify the official OpenCode 2 release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").devDependencies["@opencode/plugin"]')
          gh api "repos/anomalyco/opencode/git/ref/tags/v${version}" --silent

      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

      # dist/ is gitignored, so this also proves a clean clone produces a package
      # whose bundled entrypoint works with OpenCode 2.0.11's TUI runtime versions.
      # Its catalog resolves Solid 1.9.15, while OpenTUI's npm peer still names 1.9.12.
      - name: Verify the packed artifact with OpenCode 2.0.11 runtime versions
        run: |
          mkdir -p "$RUNNER_TEMP/enhanced-composer-pack" "$RUNNER_TEMP/enhanced-composer-install"
          npm pack --pack-destination "$RUNNER_TEMP/enhanced-composer-pack"
          npm install --ignore-scripts --legacy-peer-deps --prefix "$RUNNER_TEMP/enhanced-composer-install" \
            "$RUNNER_TEMP"/enhanced-composer-pack/opencode2-enhanced-composer-*.tgz \
            "@opentui/core@0.5.10" \
            "@opentui/solid@0.5.10" \
            "solid-js@1.9.15"
          (cd "$RUNNER_TEMP/enhanced-composer-install" && node --input-type=module -e 'await import("opencode2-enhanced-composer/tui")')
