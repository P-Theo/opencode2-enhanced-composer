name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Audit the production lockfile
        run: npm audit --package-lock-only --omit=dev --audit-level=low
      - name: Audit the full lockfile
        if: ${{ !cancelled() }}
        run: npm audit --package-lock-only --include=dev --audit-level=low

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low

  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.4.0
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - run: npm ci --ignore-scripts --no-audit
      - run: npm run check:metadata
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Pack the publishable files
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Install the terminal test dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r scripts/runtime-test-requirements.txt
      - name: Test official OpenCode runtimes
        run: |
          pack=("$RUNNER_TEMP"/opencode2-enhanced-composer-*.tgz)
          floor=$(node scripts/check-sdk-versions.mjs --floor)
          current=$(node -p 'require("./package.json").devDependencies["@opencode/plugin"]')
          python scripts/check-opencode.py "$floor" "${pack[0]}"
          python scripts/check-opencode.py 2.2.0 "${pack[0]}"
          python scripts/check-opencode.py 2.2.3 "${pack[0]}"
          python scripts/check-opencode.py "$current" "${pack[0]}" --source "$PWD" --background
